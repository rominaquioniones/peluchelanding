<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>WhatsApp</title>
    <meta name="description" content="Continuar a WhatsApp">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #25D366;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .whatsapp-icon {
            width: 120px;
            height: 120px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
            position: relative;
        }

        .whatsapp-icon:hover {
            transform: scale(1.1);
        }

        .whatsapp-icon:active {
            transform: scale(0.95);
        }

        .whatsapp-icon svg {
            width: 70px;
            height: 70px;
        }

        .loading-spinner {
            width: 120px;
            height: 120px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: absolute;
            top: 0;
            left: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .whatsapp-icon {
                width: 100px;
                height: 100px;
            }

            .whatsapp-icon svg {
                width: 60px;
                height: 60px;
            }

            .loading-spinner {
                width: 100px;
                height: 100px;
            }

            .loading-text {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="whatsapp-icon" id="whatsappButton">
            <div class="loading-spinner"></div>
            <svg viewBox="0 0 24 24" fill="#25D366" style="position: relative; z-index: 1;">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
            </svg>
        </div>
        <p class="loading-text" id="loadingText">Cargando...</p>
    </div>

    <script>
        var phoneNumber = '15557099646';
        var whatsappUrl = 'https://wa.me/' + phoneNumber;

        // Redirección automática después de 1 segundo
        setTimeout(function() {
            window.location.href = whatsappUrl;
        }, 1000);

        // Redirección inmediata al hacer clic
        document.getElementById('whatsappButton').addEventListener('click', function() {
            window.location.href = whatsappUrl;
        });

        // También redirigir al tocar cualquier parte de la página
        document.body.addEventListener('click', function() {
            window.location.href = whatsappUrl;
        });
    </script>
</body>
</html>
